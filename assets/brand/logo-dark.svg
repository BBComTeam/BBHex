<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Canonical BBHex artwork; PNG and ICO files are rendered from this SVG. -->
  <rect width="128" height="128" rx="16" fill="#1e1e1e"/>
  <text x="64" y="68" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="32" font-weight="600"
        textLength="108" lengthAdjust="spacingAndGlyphs"><tspan fill="#4a9eff">BB</tspan><tspan fill="#ffffff">Hex</tspan></text>
  <!-- BBCom family signature: purple 38.2%, green 61.8%. -->
  <rect x="16" y="88" width="36.7" height="8" rx="2" fill="#6b4c9a"/>
  <rect x="52.7" y="88" width="59.3" height="8" rx="2" fill="#7ec850"/>
</svg>
